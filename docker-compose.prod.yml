services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: keibeauty_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_ENV: production
    ports:
      - "5000:5000"
    command: >
      sh -c "flask db upgrade && gunicorn --bind 0.0.0.0:5000 --workers 4 --threads 2 --timeout 120 'app:create_app()'"
