name: Deploy Backend to EC2

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        env:
          # Los tests solo importan la app, no suben imágenes: basta un valor
          # ficticio para que routes/products.py no reviente al importar.
          IMAGEKIT_PRIVATE_KEY: test-dummy-key
        run: python -m pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # set -e detiene el deploy si un paso falla: si la migracion falla
          # NO se reinicia gunicorn, el sitio sigue sirviendo la version anterior.
          script: |
            set -e
            cd /var/www/keibeauty-backend/KeiBeauty
            git pull origin main
            echo "--- Docker (instala si falta) ---"
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
            fi
            sudo systemctl enable --now docker
            echo "--- Docker prod (build + up) ---"
            sudo docker compose -f docker-compose.prod.yml build api
            sudo docker compose -f docker-compose.prod.yml up -d api
            echo "--- Migraciones dentro del contenedor ---"
            sudo docker compose -f docker-compose.prod.yml exec -T api flask db upgrade
            echo "--- Health via nginx ---"
            sleep 5
            curl -fsS http://127.0.0.1:5000/health || curl -fsS http://127.0.0.1/health
            sudo docker compose -f docker-compose.prod.yml ps

      - name: Verificar health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 5
            curl -fsS http://127.0.0.1:5000/health || curl -fsS http://127.0.0.1/health
